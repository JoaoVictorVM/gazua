name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - run: uv lock --check
      # The MCP and trace adapters are type-checked against their optional extras.
      - run: uv sync --frozen --extra mcp --extra otel
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen pyright

  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        # 3.14 is the newest version whose full dependency set, development tools included,
        # installs on both systems. PyYAML has no Windows wheel for 3.15 yet.
        python: ["3.11", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - run: uv sync --frozen
      - run: uv run --frozen pytest

  typescript:
    uses: ./.github/workflows/typescript.yml
    permissions:
      contents: read

  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The gate compares the catalog with the base of the change.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - run: uv sync --frozen
      - name: Run the self-test benchmark with no key
        env:
          GAZUA_BENCHMARK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: uv run --frozen python .github/scripts/run_selftest.py

  unsupported-python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - run: uv sync --frozen
      - run: uv python install 3.10
      - name: Run the checks that need Python 3.10
        run: |
          GAZUA_PYTHON310="$(uv python find --no-project 3.10)"
          export GAZUA_PYTHON310
          uv run --frozen pytest -m python310

  demo-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - run: uv sync --frozen
      - name: Prepare the image context from the wheel and the locked requirements
        run: |
          uv build --wheel --out-dir dist
          uv export --frozen --no-dev --no-emit-project --format requirements.txt -o dist/requirements.txt
      - name: Build the demo image
        run: docker build --pull --tag gazua-demo:ci .
      - name: Run the demo in the image with networking disabled
        env:
          GAZUA_IMAGE: gazua-demo:ci
        run: uv run --frozen pytest tests/workflows/test_demo_image.py
