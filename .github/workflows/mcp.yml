name: mcp

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  adapter:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    env:
      # MCP tests fail instead of skipping when the extra or the fixture is missing.
      GAZUA_REQUIRE_MCP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Build the TypeScript fixture server
        working-directory: tests/support/mcp_server
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - run: uv sync --frozen --extra mcp
      - name: Run the MCP tests
        run: uv run --frozen --extra mcp pytest tests -k "mcp"

  distribution:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - run: uv sync --frozen
      - name: Install the wheel with and without the extra
        run: uv run --frozen pytest tests/packaging/test_mcp_distribution.py
