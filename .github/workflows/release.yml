name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Check that the tag matches the manifest and the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: >-
          uv run --no-project --python 3.11 .github/scripts/release_checks.py check-tag
          --tag "$GITHUB_REF_NAME"
          --commit "$GITHUB_SHA"
          --default-branch-ref "origin/$DEFAULT_BRANCH"
      - name: Check that the npm package has the same version and no runtime dependency
        run: uv run --no-project --python 3.11 .github/scripts/release_checks.py check-npm-version

  gates:
    needs: validate-source
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: gates
    runs-on: ubuntu-24.04
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Build the wheel and the sdist
        run: uv build --out-dir release-artifacts/dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Build, test and pack the npm package
        working-directory: packages/typescript
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm test
          mkdir -p ../../release-artifacts/npm
          npm pack --ignore-scripts --pack-destination ../../release-artifacts/npm
      - name: Record the digests
        run: >-
          uv run --no-project --python 3.11 .github/scripts/release_checks.py write-inventory
          --directory release-artifacts
      - name: Show the digests in the run summary
        run: |
          {
            echo "Commit: $GITHUB_SHA"
            echo '```'
            cat release-artifacts/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: release-artifacts
          if-no-files-found: error

  verify:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ["3.11", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
      GAZUA_DIST_DIR: release-artifacts/dist
      GAZUA_NPM_DIR: release-artifacts/npm
      GAZUA_REQUIRE_TYPESCRIPT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release-artifacts
      - name: Check the digests
        run: >-
          uv run --no-project .github/scripts/release_checks.py verify-inventory
          --directory release-artifacts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Build the fixture agent the installed artifacts are run against
        shell: bash
        run: |
          (cd packages/typescript && npm ci --ignore-scripts --no-audit --no-fund && npm run build)
          (cd tests/support/typescript_agent && npm ci --ignore-scripts --no-audit --no-fund && npm run build)
      - run: uv sync --frozen
      - name: Install and run exactly the artifacts built for this release
        run: uv run --frozen pytest tests/packaging

  attest:
    needs: [build, verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release-artifacts
      - name: Check the digests
        working-directory: release-artifacts
        run: |
          test "$(find dist -type f | wc -l)" -eq 2
          sha256sum --check --strict SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-artifacts/dist/*
            release-artifacts/npm/*

  publish:
    needs: [validate-source, gates, build, verify, attest]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/gazua/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release-artifacts
      - name: Check the digests
        working-directory: release-artifacts
        run: |
          test "$(find dist -type f | wc -l)" -eq 2
          sha256sum --check --strict SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: release-artifacts/dist

  # The first npm publication needs a person to confirm the package name and to configure the
  # trusted publisher on npmjs.com; the environment holds every publication for approval.
  publish-npm:
    needs: [validate-source, gates, build, verify, attest]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment:
      name: npm
      url: https://www.npmjs.com/package/gazua
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release-artifacts
      - name: Check the digests
        working-directory: release-artifacts
        run: |
          test "$(find npm -type f | wc -l)" -eq 1
          sha256sum --check --strict SHA256SUMS
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Publish exactly the validated tarball with provenance
        run: |
          tarball="$(find release-artifacts/npm -name 'gazua-*.tgz')"
          tag=latest
          case "${GITHUB_REF_NAME#v}" in *[a-z]*) tag=next ;; esac
          npm publish "$tarball" --provenance --access public --tag "$tag"

  verify-npm-publication:
    needs: [build, publish-npm]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release-artifacts
      - name: Compare the tarball on npm with the validated one
        run: >-
          uv run --no-project .github/scripts/release_checks.py verify-published-npm
          --directory release-artifacts
          --version "${GITHUB_REF_NAME#v}"
      - name: Install the public version with npm
        working-directory: ${{ runner.temp }}
        run: |
          version="$(node -p "require('$GITHUB_WORKSPACE/packages/typescript/package.json').version")"
          mkdir public-npm && cd public-npm
          npm init --yes > /dev/null
          npm install --ignore-scripts "gazua@$version"
          node --input-type=module -e "import('gazua').then((m) => { if (typeof m.wrap !== 'function') process.exit(1); })"

  image:
    needs: [build, publish]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release-artifacts
      - name: Check the digests
        working-directory: release-artifacts
        run: |
          test "$(find dist -type f | wc -l)" -eq 2
          sha256sum --check --strict SHA256SUMS
      - name: Prepare the image context from the validated wheel and the locked requirements
        run: |
          mkdir dist
          cp release-artifacts/dist/gazua-*.whl dist/
          uv export --frozen --no-dev --no-emit-project --format requirements.txt -o dist/requirements.txt
      - name: Name the image after the package version
        run: echo "GAZUA_IMAGE=ghcr.io/joaovictorvm/gazua:${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build the image and run the demo in it with networking disabled
        run: |
          docker build --pull --tag "$GAZUA_IMAGE" .
          uv sync --frozen
          uv run --frozen pytest tests/workflows/test_demo_image.py
      - name: Save the tested image with its digest
        run: |
          mkdir image
          docker save --output image/gazua-image.tar "$GAZUA_IMAGE"
          echo "$GAZUA_IMAGE" > image/IMAGE
          (cd image && sha256sum gazua-image.tar > SHA256SUMS)
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-image
          path: image
          if-no-files-found: error

  publish-image:
    needs: [image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.image.outputs.artifact-id }}
          path: image
      - name: Check the digest of the tested image
        working-directory: image
        run: sha256sum --check --strict SHA256SUMS
      - name: Publish exactly the tested image and record its digest
        working-directory: image
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          name="$(cat IMAGE)"
          case "$name" in ghcr.io/joaovictorvm/gazua:*) ;; *) exit 1 ;; esac
          docker load --input gazua-image.tar
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-config"
          mkdir -p "$DOCKER_CONFIG"
          auth="$(printf '%s:%s' "$GITHUB_ACTOR" "$REGISTRY_TOKEN" | base64 --wrap=0)"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "$auth" > "$DOCKER_CONFIG/config.json"
          docker push "$name"
          rm -rf "$DOCKER_CONFIG"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$name")"
          {
            echo "Image: $name"
            echo "Digest: $digest"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-publication:
    needs: [build, publish]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ["3.11", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release-artifacts
      - name: Compare the digests on PyPI with the validated ones
        run: >-
          uv run --no-project .github/scripts/release_checks.py verify-published
          --directory release-artifacts
          --version "${GITHUB_REF_NAME#v}"
      - name: Install the public version with pip
        working-directory: ${{ runner.temp }}
        run: |
          uv venv --seed public-pip
          scripts=public-pip/bin
          if [ -d public-pip/Scripts ]; then scripts=public-pip/Scripts; fi
          "$scripts/python" -m pip install "gazua==${GITHUB_REF_NAME#v}"
          "$scripts/gazua" --version
          "$scripts/gazua" --help
      - name: Install the public version with uv
        working-directory: ${{ runner.temp }}
        run: |
          uv tool install "gazua==${GITHUB_REF_NAME#v}"
          tools="$(uv tool dir --bin)"
          "$tools/gazua" --version
          "$tools/gazua" --help
